<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Статус AppStore</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@700;800;900&family=Rye&display=swap" rel="stylesheet">
<style>
  :root {
    /* винтажная ярмарочная палитра: ночной синий фон, бирюзовый корпус, медная отделка, кремовые лампы */
    --navy-0: #0a1628;
    --navy-1: #14294a;
    --navy-2: #2a5580;

    --teal: #4c9aa1;
    --teal-hi: #72b8bb;
    --teal-deep: #2c6a73;
    --teal-dark: #1d4c54;

    --copper: #e2a46c;
    --copper-hi: #f7d3a0;
    --copper-deep: #a8653a;
    --brown: #6b3517;
    --brown-dark: #43200c;

    --cream: #fbecd0;
    --cream-hi: #fff7e6;
    --cream-shade: #dcb888;
    --red: #cc352c;
    --red-deep: #7c1b15;
    --ink-blue: #22506e;
    --ink-blue-deep: #102c40;
    --bulb: #fff4d6;

    --copper-grad: linear-gradient(180deg, var(--copper-hi) 0%, var(--copper) 35%, var(--copper-deep) 100%);
    --copper-side: #8f5330;
    --teal-side: #173f46;
    --side: 10px;                        /* видимая правая боковина: автомат повёрнут на ¾ */
    --bevel: inset 0 2px 0 rgba(255, 245, 225, .55), inset 0 -3px 0 rgba(80, 35, 10, .45);
    --teal-cyl: linear-gradient(90deg, var(--teal-dark) 0%, var(--teal) 9%, var(--teal-hi) 36%, #86c7c8 44%, var(--teal) 72%, var(--teal-deep) 92%, var(--teal-dark) 100%);
    --machine-w: min(300px, calc(100vw - 32px - 50px));
    --reel-h: 176px;
    --item-h: 88px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    font-family: "Bitter", Georgia, serif;
    color: var(--brown);
    background: radial-gradient(circle at 50% 42%, var(--navy-2) 0%, var(--navy-1) 45%, var(--navy-0) 100%);
    background-color: var(--navy-0);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* солнечные лучи из-за автомата */
  body::before {
    content: "";
    position: fixed;
    inset: -50%;
    background: repeating-conic-gradient(from 0deg at 50% 46%, rgba(160, 205, 235, .07) 0 7deg, transparent 7deg 15deg);
    pointer-events: none;
  }
  /* зерно печатной иллюстрации поверх всего */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.25  0 0 0 0 0.15  0 0 0 0 0.08  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: .35;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 10;
  }

  .stage {
    position: relative;
    width: calc(var(--machine-w) + var(--side) + 50px);
    padding-right: calc(var(--side) + 50px);
  }
  /* тень на полу */
  .stage::after {
    content: "";
    position: absolute;
    left: -6%; right: 4%; bottom: -26px;
    height: 44px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0, 0, 0, .55), transparent);
    z-index: -1;
  }

  .machine { position: relative; width: var(--machine-w); filter: drop-shadow(0 30px 30px rgba(0, 0, 0, .45)); }
  .machine.is-lose { animation: shake .45s cubic-bezier(.36, .07, .19, .97); }

  /* ───────── резной гребень ───────── */
  .crest { display: block; width: 150px; height: 40px; margin: 0 auto -10px; position: relative; z-index: 1; filter: drop-shadow(3px 3px 0 var(--copper-side)) drop-shadow(0 4px 3px rgba(0, 0, 0, .35)); }

  /* ───────── табло ───────── */
  .marquee {
    position: relative;
    padding: 5px;
    border-radius: 50% 50% 14px 14px / 72px 72px 14px 14px;
    background: var(--copper-grad);
    box-shadow: var(--bevel), var(--side) 0 0 var(--copper-side), var(--side) 4px 6px rgba(0, 0, 0, .25);
  }
  .marquee-panel {
    position: relative;
    padding: 34px 18px 22px;
    border-radius: 50% 50% 10px 10px / 67px 67px 10px 10px;
    background:
      radial-gradient(ellipse 70% 60% at 50% 55%, var(--teal-hi) 0%, transparent 75%),
      linear-gradient(180deg, var(--teal) 0%, var(--teal-deep) 100%);
    box-shadow: inset 0 0 0 2px var(--copper-deep), inset 0 0 0 4px rgba(247, 211, 160, .35), inset 0 14px 20px -6px rgba(0, 0, 0, .45), inset 0 -10px 16px -8px rgba(0, 0, 0, .3);
    text-align: center;
  }
  .bulbs { position: absolute; inset: 0; pointer-events: none; }
  .bulbs i {
    position: absolute;
    width: 9px; height: 9px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 30%, #fff 0%, var(--bulb) 45%, #e9c48f 100%);
    box-shadow: 0 0 0 2px var(--copper-deep), 0 1px 0 2.5px rgba(0, 0, 0, .3), 0 0 8px 3px rgba(255, 222, 160, .7);
    animation: twinkle 1.6s steps(1) infinite;
    animation-delay: calc(var(--i) * -.8s);
  }
  .machine.is-spinning .bulbs i { animation: chase .45s steps(1) infinite; animation-delay: calc(var(--k) * -.15s); }
  .machine.is-win .bulbs i { animation: flash .22s steps(1) infinite; }
  .machine.is-lose .bulbs i { animation: none; background: radial-gradient(circle at 35% 30%, #ffb3a0, #b0473a 70%); box-shadow: 0 0 0 2px var(--copper-deep), 0 0 5px 1px rgba(255, 90, 60, .5); }
  @keyframes twinkle { 50% { background: radial-gradient(circle at 35% 30%, #f6e2c2 0%, #d8b284 60%, #b58659 100%); box-shadow: 0 0 0 2px var(--copper-deep), 0 1px 0 2.5px rgba(0, 0, 0, .3); } }
  @keyframes chase   { 33% { background: #b98659; box-shadow: 0 0 0 2px var(--copper-deep); } }
  @keyframes flash   { 50% { background: #fff; box-shadow: 0 0 10px 4px rgba(255, 240, 200, .95); } }

  .ribbon { display: block; width: 88%; margin: 0 auto -6px; overflow: visible; }
  .ribbon text {
    font-family: "Bitter", serif;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: 4px;
    fill: var(--brown);
  }
  .title {
    margin: 0;
    font-family: "Rye", "Bitter", serif;
    font-weight: 400;
    font-size: clamp(34px, 11vw, 42px);
    line-height: 1.1;
    color: var(--cream);
    text-shadow:
      2px 0 var(--brown), -2px 0 var(--brown), 0 2px var(--brown), 0 -2px var(--brown),
      1.5px 1.5px var(--brown), -1.5px 1.5px var(--brown), 1.5px -1.5px var(--brown), -1.5px -1.5px var(--brown),
      0 4px var(--brown-dark), 0 6px var(--brown-dark), 0 9px 8px rgba(0, 0, 0, .35);
  }
  .machine.is-win .title { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) 2; }
  @keyframes pop { 40% { transform: scale(1.07); } }

  /* ───────── корпус с барабаном ───────── */
  .body {
    position: relative;
    margin-top: -2px;
    padding: 20px 16px 22px;
    background: var(--teal-cyl);
    box-shadow:
      inset 0 0 0 4px var(--copper), inset 0 0 0 6px var(--copper-deep),
      inset 0 16px 14px -8px rgba(0, 0, 0, .4),
      var(--side) 0 0 var(--teal-side);
  }
  .frame {
    position: relative;
    padding: 9px;
    border-radius: 6px;
    background: var(--copper-grad);
    box-shadow: var(--bevel), 3px 5px 0 var(--copper-side), 4px 10px 14px rgba(0, 0, 0, .4);
  }
  /* двойная гравированная рамка */
  .frame::before {
    content: "";
    position: absolute; inset: 3px;
    border: 1.5px solid rgba(107, 53, 23, .55);
    border-radius: 4px;
    pointer-events: none;
  }
  .window {
    position: relative;
    height: var(--reel-h);
    overflow: hidden;
    border-radius: 3px;
    background: linear-gradient(180deg,
      #6b4a2c 0%, var(--cream-shade) 14%, var(--cream) 36%, var(--cream-hi) 50%, var(--cream) 64%, var(--cream-shade) 86%, #6b4a2c 100%);
    box-shadow: inset 0 0 0 2px var(--brown-dark);
  }
  .window::after {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(112deg, transparent 18%, rgba(255, 255, 255, .22) 26%, transparent 34%, transparent 62%, rgba(255, 255, 255, .12) 66%, transparent 70%),
      linear-gradient(180deg, rgba(40, 20, 5, .72) 0%, rgba(40, 20, 5, 0) 30%, rgba(40, 20, 5, 0) 68%, rgba(40, 20, 5, .72) 100%);
    box-shadow:
      inset 0 16px 14px -8px rgba(0, 0, 0, .6),
      inset 14px 0 16px -8px rgba(60, 30, 10, .6), inset -14px 0 16px -8px rgba(60, 30, 10, .6);
    pointer-events: none;
  }
  .machine.is-win .frame { box-shadow: var(--bevel), 3px 5px 0 var(--copper-side), 0 0 26px 8px rgba(255, 220, 150, .6); }

  .strip {
    position: absolute;
    left: 0; right: 0; top: 0;
    will-change: transform;
    transition: filter .35s ease-out;
  }
  .strip.is-blurred { filter: blur(2.2px); }

  .item {
    height: var(--item-h);
    display: grid;
    place-items: center;
    border-bottom: 1px solid rgba(107, 53, 23, .18);
    font-weight: 900;
    font-size: clamp(24px, 7.6vw, 29px);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .item--yes span { color: var(--red); text-shadow: 0 1px 0 #ff8f7e, 0 3px 0 var(--red-deep); }
  .item--no span  { color: var(--ink-blue); font-size: .84em; text-shadow: 0 1px 0 #6aa2c4, 0 3px 0 var(--ink-blue-deep); }

  /* ───────── ручка ───────── */
  .lever {
    --L: 104px;
    position: absolute;
    left: calc(100% + var(--side) - 2px);
    top: 50%;
    width: 50px;
    height: 0;
    z-index: 3;
  }
  .lever-mount {
    position: absolute;
    left: -2px; top: -44px;
    width: 22px; height: 88px;
    border-radius: 0 8px 8px 0;
    background: linear-gradient(90deg, var(--copper-deep) 0%, var(--copper-hi) 45%, var(--copper) 70%, var(--copper-deep) 100%);
    box-shadow: 3px 4px 8px rgba(0, 0, 0, .4);
  }
  .lever-rod {
    position: absolute;
    left: 20px; bottom: 0;
    width: 9px;
    height: var(--L);
    border-radius: 5px;
    background: linear-gradient(90deg, #8b7760 0%, #fff4e0 40%, #cdb99f 70%, #7d6a55 100%);
    transform-origin: 50% 100%;
    transform: scaleY(var(--cos, 1));
  }
  .lever-hub {
    position: absolute;
    left: 8px; top: -17px;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--copper-hi) 0%, var(--copper) 45%, var(--brown) 100%);
    box-shadow: 0 3px 6px rgba(0, 0, 0, .45);
  }
  .lever-ball {
    position: absolute;
    left: 24.5px; top: 0;
    width: 46px; height: 46px;
    margin: 0; padding: 0; border: 0;
    border-radius: 50%;
    cursor: grab;
    touch-action: none;
    background: radial-gradient(circle at 34% 28%, #ffd0c4 0%, #ec5a4c 18%, #c5291f 55%, #6e110c 100%);
    box-shadow: 0 6px 10px rgba(0, 0, 0, .45);
    transform: translate(-50%, -50%) translateY(var(--by, -104px)) scale(var(--bs, 1));
  }
  .lever-ball:active { cursor: grabbing; }
  .lever-ball:focus-visible { outline: 3px solid var(--bulb); outline-offset: 3px; }
  .lever.is-hint .lever-ball::after {
    content: "";
    position: absolute; inset: -6px;
    border-radius: 50%;
    border: 2px solid rgba(255, 238, 200, .8);
    animation: ping 1.8s ease-out infinite;
  }
  @keyframes ping {
    0%   { transform: scale(.85); opacity: .9; }
    80%, 100% { transform: scale(1.55); opacity: 0; }
  }

  /* ───────── нижняя часть с узорной панелью и табличкой ───────── */
  .lower {
    position: relative;
    margin: -2px -10px 0;
    padding: 16px 20px 18px;
    border-radius: 6px 6px 0 0;
    background: var(--teal-cyl);
    box-shadow:
      inset 0 0 0 4px var(--copper), inset 0 0 0 6px var(--copper-deep),
      inset 0 10px 0 -4px rgba(255, 255, 255, .18),
      var(--side) 0 0 var(--teal-side),
      0 -6px 10px rgba(0, 0, 0, .3);
  }
  .ornate {
    position: relative;
    padding: 18px 14px;
    border-radius: 4px;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><g fill='%23f7d3a0' fill-opacity='.55'><path transform='translate(6 6)' d='M6 0L7.8 4.1L12 4.6L8.9 7.5L9.7 12L6 9.8L2.3 12L3.1 7.5L0 4.6L4.2 4.1Z'/><path transform='translate(40 30) scale(.7)' d='M6 0L7.8 4.1L12 4.6L8.9 7.5L9.7 12L6 9.8L2.3 12L3.1 7.5L0 4.6L4.2 4.1Z'/><path transform='translate(14 44) scale(1.3)' d='M6 0L7.8 4.1L12 4.6L8.9 7.5L9.7 12L6 9.8L2.3 12L3.1 7.5L0 4.6L4.2 4.1Z'/><circle cx='50' cy='10' r='1.6'/><circle cx='30' cy='22' r='1.2'/><circle cx='56' cy='54' r='1.4'/></g></svg>"),
      linear-gradient(180deg, var(--copper) 0%, #c98450 100%);
    box-shadow: inset 0 0 0 2px var(--copper-deep), inset 0 0 0 4px rgba(247, 211, 160, .6), inset 0 0 0 5px var(--copper-deep), inset 0 12px 14px -6px rgba(60, 25, 5, .45), 0 2px 0 rgba(255, 240, 215, .35);
  }
  .plaque-wrap { filter: drop-shadow(2px 4px 0 rgba(90, 40, 12, .55)) drop-shadow(0 6px 6px rgba(0, 0, 0, .3)); }
  /* табличка-билетик с вырезанными углами */
  .plaque {
    position: relative;
    min-height: 58px;
    display: grid;
    place-items: center;
    padding: 10px 18px;
    background: radial-gradient(ellipse 80% 90% at 40% 30%, var(--cream-hi) 0%, var(--cream) 55%, #ecd3aa 100%);
    -webkit-mask: radial-gradient(circle 9px at 0 0, transparent 98%, #000) top left / 51% 51% no-repeat,
                  radial-gradient(circle 9px at 100% 0, transparent 98%, #000) top right / 51% 51% no-repeat,
                  radial-gradient(circle 9px at 0 100%, transparent 98%, #000) bottom left / 51% 51% no-repeat,
                  radial-gradient(circle 9px at 100% 100%, transparent 98%, #000) bottom right / 51% 51% no-repeat;
            mask: radial-gradient(circle 9px at 0 0, transparent 98%, #000) top left / 51% 51% no-repeat,
                  radial-gradient(circle 9px at 100% 0, transparent 98%, #000) top right / 51% 51% no-repeat,
                  radial-gradient(circle 9px at 0 100%, transparent 98%, #000) bottom left / 51% 51% no-repeat,
                  radial-gradient(circle 9px at 100% 100%, transparent 98%, #000) bottom right / 51% 51% no-repeat;
    box-shadow: inset 0 0 0 3px var(--cream), inset 0 0 0 4.5px var(--copper-deep);
    font-weight: 800;
    font-size: 17px;
    line-height: 1.2;
    text-align: center;
    color: var(--brown);
  }
  .machine.is-win .plaque  { color: var(--red); }
  .machine.is-lose .plaque { color: var(--ink-blue); }

  .plinth {
    height: 28px;
    margin: 0 -16px;
    border-radius: 5px;
    background: linear-gradient(180deg, var(--copper-hi) 0 2px, var(--copper) 2px 7px, var(--copper-deep) 7px 9px, #2a5f68 9px, var(--teal-dark) 60%, #133238 100%);
    box-shadow: var(--side) 0 0 #0f2a30, inset 0 -3px 0 rgba(0, 0, 0, .35);
  }

  /* ───────── звёзды при выигрыше ───────── */
  .fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 5; }
  .star {
    position: absolute;
    left: var(--x); top: var(--y);
    width: var(--s); height: var(--s);
    margin: calc(var(--s) / -2);
    background: var(--c);
    clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    opacity: 0;
    animation: fly 1.5s cubic-bezier(.2, .6, .4, 1) forwards;
    animation-delay: var(--d);
  }
  @keyframes fly {
    0%   { opacity: 1; transform: translate(0, 0) rotate(0) scale(.4); }
    35%  { opacity: 1; transform: translate(calc(var(--dx) * .55), var(--dy)) rotate(180deg) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), 420px) rotate(540deg) scale(.9); }
  }

  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-6px); }
    40%, 60% { transform: translateX(6px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bulbs i, .lever.is-hint .lever-ball::after { animation: none !important; }
    .strip.is-blurred { filter: none; }
    .machine.is-lose, .machine.is-win .title { animation: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="machine" id="machine">
      <!-- резной гребень -->
      <svg class="crest" viewBox="0 0 150 40" aria-hidden="true">
        <defs>
          <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f7d3a0"/><stop offset=".45" stop-color="#e2a46c"/><stop offset="1" stop-color="#a8653a"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke="url(#cg)" stroke-width="5" stroke-linecap="round">
          <path d="M58 30 C44 30 38 18 28 20 C19 22 20 33 28 33 C33 33 34 28 30 27"/>
          <path d="M92 30 C106 30 112 18 122 20 C131 22 130 33 122 33 C117 33 116 28 120 27"/>
        </g>
        <path d="M75 3 C89 3 97 15 97 30 L53 30 C53 15 61 3 75 3Z" fill="url(#cg)"/>
        <g stroke="#a8653a" stroke-width="1.6" stroke-linecap="round">
          <path d="M75 28 L75 8"/><path d="M75 28 L64 12"/><path d="M75 28 L86 12"/><path d="M75 28 L58 20"/><path d="M75 28 L92 20"/>
        </g>
        <rect x="40" y="31" width="70" height="7" rx="3.5" fill="url(#cg)"/>
      </svg>

      <header class="marquee">
        <div class="marquee-panel" id="marqueePanel">
          <div class="bulbs" id="bulbs" aria-hidden="true"></div>
          <svg class="ribbon" viewBox="0 0 240 70" aria-hidden="true">
            <path d="M8 62 L30 44 L34 66 Z M232 62 L210 44 L206 66 Z" fill="#a8653a"/>
            <path d="M24 52 Q120 8 216 52" fill="none" stroke="#a8653a" stroke-width="27"/>
            <path d="M24 52 Q120 8 216 52" fill="none" stroke="#fbecd0" stroke-width="22"/>
            <path id="arc" d="M24 57 Q120 13 216 57" fill="none"/>
            <text><textPath href="#arc" startOffset="50%" text-anchor="middle">СТАТУС</textPath></text>
          </svg>
          <h1 class="title"><span class="sr-only">Статус </span>AppStore</h1>
        </div>
      </header>

      <section class="body">
        <div class="frame">
          <div class="window">
            <div class="strip" id="strip" aria-hidden="true"></div>
          </div>
        </div>

        <div class="lever is-hint" id="lever">
          <div class="lever-mount"></div>
          <div class="lever-rod"></div>
          <div class="lever-hub"></div>
          <button class="lever-ball" id="leverBall" type="button" aria-label="Дёрнуть ручку"></button>
        </div>
      </section>

      <div class="lower">
        <div class="ornate">
          <div class="plaque-wrap"><div class="plaque" role="status" aria-live="polite"><span id="status">Дёрни за ручку</span></div></div>
        </div>
      </div>
      <div class="plinth"></div>
    </div>

    <div class="fx" id="fx" aria-hidden="true"></div>
  </main>

<style>.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style>
<script>
(() => {
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();
  tg?.disableVerticalSwipes?.();       // иначе рывок ручки вниз сворачивает Mini App
  tg?.setHeaderColor?.('#0a1628');
  tg?.setBackgroundColor?.('#0a1628');
  const haptic = tg?.HapticFeedback;

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);
  const machine = $('machine'), strip = $('strip'), lever = $('lever'), ball = $('leverBall');
  const statusEl = $('status'), bulbsEl = $('bulbs'), fx = $('fx');

  const TEXT = { yes: 'Отпустило', no: 'Не отпустило' };
  const MESSAGES = { yes: 'Грузим прилы!', no: 'Всем прилам РЕДЖЕКТ' };

  /* ── лента барабана: чётные — «отпустило», нечётные — «не отпустило» ── */
  const ITEMS = 64;
  for (let i = 0; i < ITEMS; i++) {
    const kind = i % 2 === 0 ? 'yes' : 'no';
    const el = document.createElement('div');
    el.className = `item item--${kind}`;
    el.innerHTML = `<span>${TEXT[kind]}</span>`;
    strip.appendChild(el);
  }
  const cssPx = (name) => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));
  const itemH = cssPx('--item-h'), reelH = cssPx('--reel-h');
  const yFor = (index) => -index * itemH + (reelH - itemH) / 2;
  let current = 3;
  strip.style.transform = `translateY(${yFor(current)}px)`;

  /* ── лампочки по контуру табло (арка сверху, прямые бока и низ) ── */
  function layoutBulbs() {
    bulbsEl.innerHTML = '';
    const w = bulbsEl.clientWidth, h = bulbsEl.clientHeight;
    const R = 67, d = 12, step = 21;
    const path = [];
    for (let y = h - d; y > R; y -= 2) path.push([d, y]);
    for (let a = Math.PI; a <= 2 * Math.PI; a += 0.01) path.push([w / 2 + (w / 2 - d) * Math.cos(a), R + (R - d) * Math.sin(a)]);
    for (let y = R; y < h - d; y += 2) path.push([w - d, y]);
    for (let x = w - d; x > d; x -= 2) path.push([x, h - d]);

    let acc = step, k = 0;
    for (let i = 1; i < path.length; i++) {
      acc += Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]);
      if (acc < step) continue;
      acc = 0;
      const b = document.createElement('i');
      b.style.left = `${path[i][0]}px`;
      b.style.top = `${path[i][1]}px`;
      b.style.setProperty('--i', k % 2);
      b.style.setProperty('--k', k % 3);
      bulbsEl.appendChild(b);
      k++;
    }
  }
  document.fonts.ready.then(layoutBulbs);
  addEventListener('resize', layoutBulbs);

  /* ── геометрия ручки: p ∈ [0..1] → угол 0..160° (ручка «падает» к зрителю) ── */
  const L = 104;
  let leverP = 0;
  function setLever(p) {
    leverP = p;
    const a = p * (160 * Math.PI / 180);
    lever.style.setProperty('--cos', Math.cos(a).toFixed(4));
    lever.style.setProperty('--by', `${(-L * Math.cos(a)).toFixed(2)}px`);
    lever.style.setProperty('--bs', (1 + 0.28 * Math.sin(a)).toFixed(4));
  }
  setLever(0);

  function tween(from, to, ms, ease, onUpdate) {
    return new Promise((resolve) => {
      const t0 = performance.now();
      const frame = (now) => {
        const t = Math.min(1, (now - t0) / ms);
        onUpdate(from + (to - from) * ease(t));
        t < 1 ? requestAnimationFrame(frame) : resolve();
      };
      requestAnimationFrame(frame);
    });
  }
  const easeIn = (t) => t * t * t;
  const easeOutBack = (t) => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * (t - 1) ** 3 + c1 * (t - 1) ** 2; };
  const springBack = () => tween(leverP, 0, 650, easeOutBack, setLever);

  /* ── вращение ── */
  let busy = false;
  const setState = (s) => {
    machine.classList.remove('is-spinning', 'is-win', 'is-lose');
    if (s) machine.classList.add(`is-${s}`);
  };

  async function spin() {
    if (busy) return;
    busy = true;
    lever.classList.remove('is-hint');
    setState('spinning');
    statusEl.textContent = 'Проверяем статус…';
    haptic?.impactOccurred('heavy');

    const isYes = Math.random() < 0.5;
    const rounds = 18 + Math.floor(Math.random() * 6);
    let target = current + rounds * 2;
    if ((target % 2 === 0) !== isYes) target += 1;

    const duration = reduceMotion ? 900 : 2600 + Math.random() * 500;
    if (!reduceMotion) strip.classList.add('is-blurred');
    setTimeout(() => strip.classList.remove('is-blurred'), duration * 0.62);

    // тиканье вибрацией при прохождении каждой ячейки
    let lastIdx = current, lastTick = 0, ticking = true;
    const tick = (now) => {
      if (!ticking) return;
      const y = new DOMMatrix(getComputedStyle(strip).transform).m42;
      const idx = Math.round(((reelH - itemH) / 2 - y) / itemH);
      if (idx !== lastIdx && now - lastTick > 45) { haptic?.selectionChanged(); lastTick = now; }
      lastIdx = idx;
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);

    const anim = strip.animate(
      [{ transform: `translateY(${yFor(current)}px)` }, { transform: `translateY(${yFor(target) - 14}px)` }],
      { duration, easing: 'cubic-bezier(.12,.62,.16,1)', fill: 'forwards' }
    );
    await anim.finished;
    const settle = strip.animate(
      [{ transform: `translateY(${yFor(target) - 14}px)` }, { transform: `translateY(${yFor(target)}px)` }],
      { duration: 380, easing: 'cubic-bezier(.34,1.8,.5,1)', fill: 'forwards' }
    );
    await settle.finished;
    ticking = false;

    // лента повторяется через 2 ячейки — незаметно возвращаемся к началу
    current = 2 + (target % 2);
    strip.style.transform = `translateY(${yFor(current)}px)`;
    anim.cancel(); settle.cancel();

    setState(isYes ? 'win' : 'lose');
    statusEl.textContent = MESSAGES[isYes ? 'yes' : 'no'];
    haptic?.notificationOccurred(isYes ? 'success' : 'error');
    if (isYes && !reduceMotion) burstStars();

    busy = false;
    setTimeout(() => { if (!busy) lever.classList.add('is-hint'); }, 2500);
  }

  function burstStars() {
    const colors = ['#fbecd0', '#f7d3a0', '#e2a46c', '#cc352c', '#72b8bb'];
    const s = fx.getBoundingClientRect(), w = document.querySelector('.window').getBoundingClientRect();
    const cx = w.left - s.left + w.width / 2, cy = w.top - s.top + w.height / 2;
    for (let i = 0; i < 24; i++) {
      const el = document.createElement('span');
      el.className = 'star';
      el.style.setProperty('--s', `${14 + Math.random() * 16}px`);
      el.style.setProperty('--c', colors[i % colors.length]);
      el.style.setProperty('--x', `${cx}px`);
      el.style.setProperty('--y', `${cy}px`);
      el.style.setProperty('--dx', `${(Math.random() - 0.5) * 360}px`);
      el.style.setProperty('--dy', `${-120 - Math.random() * 180}px`);
      el.style.setProperty('--d', `${Math.random() * 180}ms`);
      fx.appendChild(el);
      setTimeout(() => el.remove(), 1900);
    }
  }

  /* ── управление ручкой: тянуть вниз или просто тапнуть ── */
  async function autoPull() {
    if (busy) return;
    await tween(leverP, 1, reduceMotion ? 120 : 260, easeIn, setLever);
    spin();
    springBack();
  }

  let drag = null;
  ball.addEventListener('pointerdown', (e) => {
    if (busy) return;
    drag = { y0: e.clientY, moved: 0, fired: false };
    ball.setPointerCapture(e.pointerId);
  });
  ball.addEventListener('pointermove', (e) => {
    if (!drag || drag.fired) return;
    const dy = e.clientY - drag.y0;
    drag.moved = Math.max(drag.moved, Math.abs(dy));
    setLever(Math.min(1, Math.max(0, dy / 190)));
    if (leverP >= 0.92) {
      drag.fired = true;
      setLever(1);
      spin();
      springBack();
    }
  });
  const endDrag = () => {
    if (!drag) return;
    const { moved, fired } = drag;
    drag = null;
    if (fired) return;
    if (moved < 6) autoPull();
    else springBack();
  };
  ball.addEventListener('pointerup', endDrag);
  ball.addEventListener('pointercancel', endDrag);
  ball.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); autoPull(); }
  });
})();
</script>
</body>
</html>
