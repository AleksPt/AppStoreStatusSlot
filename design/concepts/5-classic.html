<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Концепт 5 — Классический казино-автомат</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Playfair+Display:ital,wght@0,800;0,900;1,900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: linear-gradient(180deg, #fbefc8 0%, #d9b66a 22%, #9c7632 50%, #e9cf8f 68%, #b08a42 82%, #6e4f1c 100%);
    --gold-h: linear-gradient(90deg, #6e4f1c 0%, #b08a42 12%, #f6e4b0 34%, #c9a45c 55%, #8a6a2e 78%, #d9bb77 90%, #5e4216 100%);
    --brushed: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,.04) 1px 3px);
    --red: #c8141c; --red-deep: #6a070b;
  }
  * { box-sizing: border-box; }
  body {
    width: 390px; height: 844px; margin: 0; overflow: hidden; position: relative;
    display: grid; place-items: center;
    font-family: "Playfair Display", Georgia, serif;
    background: #2a0405;
  }
  /* бархатный занавес */
  .curtain {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 55% 45% at 50% 40%, rgba(255, 170, 110, .35), transparent 70%),
      repeating-linear-gradient(90deg, #4a0608 0px, #8e1016 14px, #b3191f 24px, #7a0c11 36px, #3a0406 48px),
      #5a0609;
  }
  .curtain::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, transparent 25%, transparent 60%, rgba(0,0,0,.6) 100%),
                radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,.6) 100%);
  }
  /* блик лампы справа сверху */
  .lamp { position: absolute; right: -40px; top: 60px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 220, 150, .75), rgba(255, 180, 90, .2) 40%, transparent 70%); }

  /* круглый стол */
  .table {
    position: absolute; left: -40px; right: -40px; bottom: 0; height: 190px;
    background:
      radial-gradient(ellipse 60% 40% at 50% 20%, rgba(255, 200, 120, .35), transparent 70%),
      linear-gradient(180deg, #a86a2a 0%, #6e3d14 22%, #3a1c07 23%, #1a0b02 100%);
    border-radius: 50% 50% 0 0 / 50px 50px 0 0;
  }

  .stage { position: relative; width: 352px; padding-right: 52px; z-index: 2; margin-top: -40px; }
  .machine { position: relative; width: 300px; filter: drop-shadow(0 30px 24px rgba(0,0,0,.6)); }

  .knob { width: 40px; height: 26px; margin: 0 auto -4px; border-radius: 20px 20px 4px 4px; background: radial-gradient(ellipse at 40% 30%, #fff6d8, #c9a45c 45%, #5e4216); }

  /* купол с красным стеклом */
  .dome {
    position: relative; padding: 9px 9px 0;
    border-radius: 150px 150px 0 0 / 130px 130px 0 0;
    background: var(--brushed), var(--gold);
  }
  .dome-glass {
    height: 132px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; padding-top: 16px;
    border-radius: 141px 141px 0 0 / 122px 122px 0 0;
    background:
      radial-gradient(ellipse 60% 70% at 50% 60%, #ff4a3f 0%, #c3141b 45%, #6a070b 100%);
    box-shadow: inset 0 0 0 2px #5e4216, inset 0 10px 24px rgba(0,0,0,.5), inset 0 -6px 12px rgba(0,0,0,.35);
    position: relative; overflow: hidden;
  }
  .dome-glass::after {
    content: ""; position: absolute; left: 18%; top: 8%; width: 30%; height: 40%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,.35), transparent 70%);
    transform: rotate(-25deg);
  }
  .kicker { font-weight: 800; font-size: 13px; letter-spacing: .5em; padding-left: .5em; color: #ffe7b8; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .title {
    margin: 2px 0 0; font-style: italic; font-weight: 900; font-size: 44px; line-height: 1.05;
    background: linear-gradient(180deg, #fff6d6 0%, #f3d27e 45%, #b8862c 55%, #fbe4a3 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 #4a0406) drop-shadow(0 0 10px rgba(255, 200, 120, .45));
  }

  /* панели с табличками (пейтейбл) */
  .labels {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 8px 12px;
    background: var(--brushed), var(--gold-h);
  }
  .labels span {
    height: 15px; display: grid; place-items: center; border-radius: 2px;
    background: linear-gradient(180deg, #fff, #efe8dc);
    box-shadow: inset 0 0 0 1px #8a6a2e, 0 0 6px rgba(255, 240, 210, .6);
    font-family: "Oswald", sans-serif; font-weight: 700; font-size: 8.5px; letter-spacing: .06em; color: var(--red);
  }

  .body {
    position: relative; padding: 12px 14px 14px;
    background: var(--brushed), var(--gold-h);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 0 rgba(0,0,0,.3);
  }
  .frame {
    padding: 7px; border-radius: 6px;
    background: var(--gold);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 3px 6px rgba(0,0,0,.45);
  }
  .window {
    position: relative; height: 184px; overflow: hidden; border-radius: 3px;
    background: linear-gradient(180deg, #5a4a38 0%, #d9d0c2 14%, #fbf8f2 38%, #fff 50%, #fbf8f2 62%, #d9d0c2 86%, #5a4a38 100%);
    box-shadow: inset 0 0 0 2px #2a1a08;
  }
  .window::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(20,10,0,.7) 0%, transparent 28%, transparent 72%, rgba(20,10,0,.7) 100%),
      linear-gradient(115deg, transparent 60%, rgba(255,255,255,.35) 60% 64%, transparent 64%);
    box-shadow: inset 0 16px 14px -8px rgba(0,0,0,.6), inset 14px 0 14px -8px rgba(0,0,0,.45), inset -14px 0 14px -8px rgba(0,0,0,.45);
  }
  .payline { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(200, 20, 28, .5); z-index: 2; }
  .strip { position: absolute; left: 0; right: 0; top: -46px; }
  .row { height: 92px; display: grid; place-items: center; font-weight: 900; text-transform: uppercase; white-space: nowrap; border-bottom: 1px solid rgba(0,0,0,.12); }
  .row.yes { font-size: 32px; color: var(--red); text-shadow: 0 2px 0 var(--red-deep), 0 4px 6px rgba(0,0,0,.25); }
  .row.no  { font-size: 26px; color: #1e1e1e; text-shadow: 0 2px 0 #000; }

  /* подсвеченная табличка статуса */
  .status {
    margin-top: 12px; padding: 5px; border-radius: 6px;
    background: var(--gold);
    box-shadow: 0 3px 6px rgba(0,0,0,.4);
  }
  .status div {
    display: grid; place-items: center; min-height: 52px; border-radius: 3px;
    background: radial-gradient(ellipse at 50% 40%, #fffef8, #f3eadb 70%, #d9ccb4);
    box-shadow: inset 0 0 0 1px #8a6a2e, 0 0 14px rgba(255, 240, 200, .6);
    font-family: "Oswald", sans-serif; font-weight: 700; font-size: 22px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--red); text-shadow: 0 0 8px rgba(255, 60, 40, .35);
  }

  .lower {
    position: relative; margin: 0 -8px; padding: 14px 20px 16px;
    border-radius: 0 0 6px 6px;
    background: var(--brushed), linear-gradient(180deg, #8a6a2e 0%, #d9bb77 12%, #b08a42 40%, #6e4f1c 100%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.35);
  }
  .tray {
    height: 30px; border-radius: 4px 4px 10px 10px;
    background: linear-gradient(180deg, #1a0f04, #4a3514);
    box-shadow: inset 0 6px 8px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.3);
  }
  .plinth { height: 16px; margin: 0 -16px; border-radius: 3px; background: var(--gold); box-shadow: 0 6px 10px rgba(0,0,0,.5); }

  .lever { position: absolute; left: calc(100% - 2px); top: 50%; width: 52px; height: 0; }
  .lever .mount { position: absolute; left: 0; top: -42px; width: 24px; height: 84px; border-radius: 0 12px 12px 0; background: var(--brushed), linear-gradient(90deg, #5e4216, #f6e4b0 45%, #b08a42 70%, #5e4216); box-shadow: 3px 4px 8px rgba(0,0,0,.5); }
  .lever .rod { position: absolute; left: 22px; bottom: 0; width: 9px; height: 110px; border-radius: 5px; background: linear-gradient(90deg, #6e4f1c, #fbefc8 40%, #c9a45c 70%, #5e4216); }
  .lever .hub { position: absolute; left: 10px; top: -17px; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6d8, #c9a45c 45%, #5e4216); box-shadow: 0 3px 6px rgba(0,0,0,.5); }
  .lever .ball { position: absolute; left: 26.5px; top: -110px; width: 46px; height: 46px; margin: -23px; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #fff 0%, #ff6a5e 14%, var(--red) 50%, #4a0406 100%); box-shadow: 0 6px 12px rgba(0,0,0,.5); }
</style>
</head>
<body>
  <div class="curtain"></div>
  <div class="lamp"></div>
  <div class="table"></div>

  <div class="stage">
    <div class="machine">
      <div class="knob"></div>
      <div class="dome">
        <div class="dome-glass">
          <div class="kicker">СТАТУС</div>
          <h1 class="title">AppStore</h1>
        </div>
      </div>
      <div class="labels"><span>REVIEW</span><span>4.3</span><span>2.1</span><span>5.1.1</span></div>

      <section class="body">
        <div class="frame">
          <div class="window">
            <span class="payline"></span>
            <div class="strip">
              <div class="row no">Не отпустило</div>
              <div class="row yes">Отпустило</div>
              <div class="row no">Не отпустило</div>
            </div>
          </div>
        </div>
        <div class="status"><div>Грузим прилы!</div></div>
        <div class="lever"><div class="mount"></div><div class="rod"></div><div class="hub"></div><div class="ball"></div></div>
      </section>

      <div class="labels"><span>TESTFLIGHT</span><span>METADATA</span><span>BUILD</span><span>RELEASE</span></div>
      <div class="lower"><div class="tray"></div></div>
      <div class="plinth"></div>
    </div>
  </div>
</body>
</html>
