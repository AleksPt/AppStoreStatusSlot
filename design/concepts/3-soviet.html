<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Концепт 3 — Советский игровой автомат</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Stalinist+One&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #b8272c; --red-hi: #d8453f; --red-deep: #7e1519;
    --cream: #efe3c3; --cream-shade: #d8c79c;
    --chrome: linear-gradient(180deg, #fbfbfb 0%, #b9bcc0 45%, #eceef0 55%, #8a8e94 100%);
    --ink: #1d1a17;
  }
  * { box-sizing: border-box; }
  body {
    width: 390px; height: 844px; margin: 0; overflow: hidden;
    display: grid; place-items: center;
    font-family: "Oswald", sans-serif;
    background:
      linear-gradient(180deg, #5d786c 0%, #4d665b 64%, #3b2c22 64%, #5a4331 100%);
  }
  /* плитка-кабанчик на нижней половине стены и линолеум на полу */
  body::before {
    content: ""; position: fixed; left: 0; right: 0; top: 40%; height: 24%;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.1) 0 1px, transparent 1px 44px),
      #7f9a8c;
  }
  body::after {
    content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 36%;
    background: repeating-conic-gradient(#6d5139 0 25%, #5a4230 0 50%) 0 0 / 60px 60px;
    opacity: .6;
  }

  .stage { position: relative; width: 352px; padding-right: 52px; z-index: 1; }
  .machine { position: relative; width: 300px; }

  .star {
    width: 40px; height: 40px; margin: 0 auto -6px;
    background: linear-gradient(160deg, #ff5a4f, var(--red-deep));
    clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    position: relative; z-index: 2;
  }

  .shell {
    padding: 5px; border-radius: 16px;
    background: var(--chrome);
    box-shadow: 0 20px 30px rgba(0,0,0,.45);
  }
  .body {
    position: relative; border-radius: 12px; padding: 14px 14px 16px;
    background:
      linear-gradient(100deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 22%),
      linear-gradient(180deg, var(--red-hi), var(--red) 30%, var(--red-deep));
  }
  .rivet { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #9a9da2 60%, #55585c); box-shadow: 0 1px 1px rgba(0,0,0,.5); }

  .sign {
    padding: 14px 10px 12px; text-align: center;
    border-radius: 6px;
    background: linear-gradient(180deg, #f6ecd2, var(--cream) 60%, var(--cream-shade));
    box-shadow: inset 0 0 0 3px var(--red-deep), inset 0 0 0 5px var(--cream), inset 0 0 0 6px var(--red-deep), 0 3px 0 rgba(0,0,0,.25);
  }
  .kicker { font-family: "Stalinist One", sans-serif; font-size: 13px; letter-spacing: .3em; padding-left: .3em; color: var(--ink); }
  .title {
    margin: 8px 0 0; font-family: "Stalinist One", sans-serif; font-weight: 400;
    font-size: 25px; line-height: 1.1; color: var(--red);
    text-shadow: 2px 2px 0 var(--red-deep);
  }

  .bezel {
    margin-top: 14px; padding: 8px; border-radius: 14px;
    background: var(--chrome);
    box-shadow: 0 4px 6px rgba(0,0,0,.4);
  }
  .window {
    position: relative; height: 176px; overflow: hidden; border-radius: 8px;
    background: linear-gradient(180deg, #8a8579 0%, #e9e5da 20%, #fbf9f3 50%, #e9e5da 80%, #8a8579 100%);
    box-shadow: inset 0 0 0 2px #2b2926;
  }
  .window::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(20,15,10,.55) 0%, transparent 28%, transparent 72%, rgba(20,15,10,.55) 100%),
      linear-gradient(120deg, transparent 60%, rgba(255,255,255,.35) 60% 66%, transparent 66%);
  }
  .wire { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: rgba(184,39,44,.7); z-index: 2; }
  .wire.a { margin-top: -38px; } .wire.b { margin-top: 36px; }
  .strip { position: absolute; left: 0; right: 0; top: -44px; }
  .row { height: 88px; display: grid; place-items: center; font-weight: 700; text-transform: uppercase; white-space: nowrap; letter-spacing: .02em; border-bottom: 1px solid rgba(0,0,0,.12); }
  .row.yes { font-size: 40px; color: var(--ink); }
  .row.no  { font-size: 34px; color: var(--red); }

  .panel { display: flex; gap: 10px; margin-top: 14px; }
  .plaque {
    flex: 1; display: grid; place-items: center; min-height: 62px; padding: 8px;
    border-radius: 6px;
    background: linear-gradient(180deg, #f6ecd2, var(--cream-shade));
    box-shadow: inset 0 0 0 2px var(--red-deep), 0 3px 0 rgba(0,0,0,.25);
    font-weight: 700; font-size: 21px; letter-spacing: .04em; text-transform: uppercase; color: var(--red);
  }
  .coin {
    width: 70px; padding: 8px 6px; border-radius: 6px; text-align: center;
    background: var(--chrome);
    box-shadow: 0 3px 0 rgba(0,0,0,.3);
    font-weight: 700; font-size: 12px; color: #33363a;
  }
  .coin .slot { width: 8px; height: 30px; margin: 0 auto 6px; border-radius: 4px; background: #1a1a1a; box-shadow: inset 0 2px 3px #000, 0 1px 0 rgba(255,255,255,.8); }

  .model { margin-top: 12px; text-align: center; font-size: 11px; letter-spacing: .25em; color: rgba(239,227,195,.75); text-transform: uppercase; }

  .legs { display: flex; justify-content: space-between; padding: 0 18px; }
  .legs i { width: 44px; height: 18px; border-radius: 0 0 6px 6px; background: linear-gradient(180deg, #2b2b2b, #111); }

  .lever { position: absolute; left: calc(100% - 2px); top: 50%; width: 52px; height: 0; }
  .lever .mount { position: absolute; left: 0; top: -38px; width: 20px; height: 76px; border-radius: 0 8px 8px 0; background: linear-gradient(90deg, #6f7378, #f4f5f6 45%, #9da1a6 70%, #55585c); }
  .lever .rod { position: absolute; left: 21px; bottom: 0; width: 8px; height: 106px; border-radius: 4px; background: linear-gradient(90deg, #6f7378, #fff 40%, #a3a7ac 70%, #55585c); }
  .lever .hub { position: absolute; left: 9px; top: -16px; width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #a3a7ac 50%, #3e4145); }
  .lever .ball { position: absolute; left: 25px; top: -106px; width: 42px; height: 42px; margin: -21px; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #8a8a8a 0%, #2a2a2a 30%, #0b0b0b 100%); box-shadow: 0 6px 10px rgba(0,0,0,.5); }
</style>
</head>
<body>
  <div class="stage">
    <div class="machine">
      <div class="star"></div>
      <div class="shell">
        <div class="body">
          <span class="rivet" style="left:5px; top:5px"></span><span class="rivet" style="right:5px; top:5px"></span>
          <span class="rivet" style="left:5px; bottom:5px"></span><span class="rivet" style="right:5px; bottom:5px"></span>

          <header class="sign">
            <div class="kicker">СТАТУС</div>
            <h1 class="title">AppStore</h1>
          </header>

          <div class="bezel">
            <div class="window">
              <span class="wire a"></span><span class="wire b"></span>
              <div class="strip">
                <div class="row no">Не отпустило</div>
                <div class="row yes">Отпустило</div>
                <div class="row no">Не отпустило</div>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="plaque">Грузим прилы!</div>
            <div class="coin"><div class="slot"></div>15 коп.</div>
          </div>

          <div class="model">Игровой автомат «Ревью-1»</div>

          <div class="lever"><div class="mount"></div><div class="rod"></div><div class="hub"></div><div class="ball"></div></div>
        </div>
      </div>
      <div class="legs"><i></i><i></i></div>
    </div>
  </div>
</body>
</html>
