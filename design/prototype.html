<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Статус AppStore</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #070204;
    --bg-1: #1a0710;
    --bg-2: #43101f;

    --gold-grad: linear-gradient(180deg, #fff4bd 0%, #f1c95f 20%, #b98424 48%, #f5d67a 66%, #8a5a12 100%);
    --gold-grad-h: linear-gradient(90deg, #7a4d0e 0%, #f1c95f 22%, #fff4bd 40%, #b98424 68%, #f5d67a 86%, #6d440c 100%);
    --lacquer: linear-gradient(180deg, #38383e 0%, #121215 34%, #060607 70%, #1c1c20 100%);

    --cream: #fff8ea;
    --red: #d9161c;
    --red-deep: #5a0a0d;
    --outline: #ffcf3f;
    --win: #ffd23f;

    --machine-w: min(320px, calc(100vw - 32px - 46px));
    --reel-h: 200px;
    --item-h: 96px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    font-family: "Manrope", system-ui, sans-serif;
    color: var(--cream);
    background:
      radial-gradient(120% 70% at 50% 18%, rgba(255, 190, 90, .16) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 40%, var(--bg-2) 0%, var(--bg-1) 52%, var(--bg-0) 100%);
    background-color: var(--bg-0);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* мягкие «прожекторные» лучи за автоматом */
  body::before {
    content: "";
    position: fixed;
    inset: -20% -40% 30%;
    background: repeating-conic-gradient(from 0deg at 50% 0%, rgba(255, 210, 120, .06) 0 6deg, transparent 6deg 16deg);
    -webkit-mask: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 70%);
            mask: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 70%);
    pointer-events: none;
  }

  .stage {
    position: relative;
    width: calc(var(--machine-w) + 46px);
    padding-right: 46px;
  }

  /* ───────── корпус ───────── */
  .machine {
    position: relative;
    width: var(--machine-w);
    padding: 10px;
    border-radius: 34px 34px 22px 22px;
    background: var(--gold-grad);
    box-shadow:
      0 40px 60px -20px rgba(0, 0, 0, .8),
      0 0 0 1px rgba(0, 0, 0, .6),
      0 0 80px rgba(255, 180, 60, .12);
  }
  .machine.is-lose { animation: shake .45s cubic-bezier(.36, .07, .19, .97); }

  .body {
    position: relative;
    border-radius: 26px 26px 14px 14px;
    background: var(--lacquer);
    padding: 12px 12px 14px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), inset 0 -2px 6px rgba(0, 0, 0, .8);
  }
  /* глянцевый блик на лаке */
  .body::before {
    content: "";
    position: absolute;
    inset: 0 0 auto;
    height: 50%;
    border-radius: 26px 26px 0 0;
    background: linear-gradient(180deg, rgba(255, 255, 255, .06), transparent);
    pointer-events: none;
  }

  /* ───────── табло с заголовком ───────── */
  .marquee {
    position: relative;
    border-radius: 18px;
    padding: 3px;
    background: var(--gold-grad);
  }
  .marquee-panel {
    position: relative;
    border-radius: 15px;
    padding: 22px 16px 20px;
    text-align: center;
    background:
      radial-gradient(ellipse at 50% 120%, rgba(255, 60, 60, .35), transparent 60%),
      linear-gradient(180deg, #2a0409 0%, #12020a 100%);
    box-shadow: inset 0 0 24px rgba(0, 0, 0, .9);
    overflow: hidden;
  }
  .bulbs { position: absolute; inset: 8px; pointer-events: none; }
  .bulbs i {
    position: absolute;
    width: 7px; height: 7px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: #5e3c10;
    animation: chase 1.2s linear infinite;
    animation-delay: calc(var(--i) * -.4s);
  }
  .machine.is-spinning .bulbs i { animation-duration: .6s; }
  .machine.is-win .bulbs i { animation-duration: .3s; }
  .machine.is-lose .bulbs i { animation-name: chase-red; animation-duration: 1.6s; }

  @keyframes chase {
    0%, 33%   { background: #fff3c4; box-shadow: 0 0 6px 2px rgba(255, 200, 80, .9); }
    34%, 100% { background: #5e3c10; box-shadow: none; }
  }
  @keyframes chase-red {
    0%, 33%   { background: #ffb3b3; box-shadow: 0 0 6px 2px rgba(255, 50, 50, .85); }
    34%, 100% { background: #4a0d0d; box-shadow: none; }
  }

  .title { margin: 0; line-height: 1; font-weight: 400; }
  .title-kicker {
    display: block;
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: .42em;
    text-transform: uppercase;
    color: #ffd9a0;
    opacity: .85;
    margin-bottom: 8px;
    padding-left: .42em;
  }
  .title-main {
    display: block;
    font-family: "Russo One", sans-serif;
    font-size: clamp(30px, 10.5vw, 40px);
    letter-spacing: .01em;
    background: linear-gradient(180deg, #fffbe0 0%, #ffe07a 45%, #e0a21f 55%, #ffe9a3 100%);
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 0 #5a2a00) drop-shadow(0 0 14px rgba(255, 190, 60, .55));
  }
  .machine.is-win .title-main { animation: flash .3s steps(2) 6; }
  @keyframes flash { 50% { filter: drop-shadow(0 2px 0 #5a2a00) drop-shadow(0 0 26px rgba(255, 230, 120, 1)); } }

  /* ───────── окно барабана ───────── */
  .cabinet { position: relative; margin-top: 14px; }

  .bezel {
    position: relative;
    padding: 7px;
    border-radius: 16px;
    background: var(--gold-grad);
    box-shadow: 0 6px 14px rgba(0, 0, 0, .6);
  }
  .window {
    position: relative;
    height: var(--reel-h);
    border-radius: 10px;
    overflow: hidden;
    background: linear-gradient(180deg, #5b4a36 0%, #d8cab0 16%, var(--cream) 40%, var(--cream) 60%, #d8cab0 84%, #5b4a36 100%);
    box-shadow: inset 0 0 0 2px #1a1208;
  }
  /* объём цилиндра и стекло поверх ленты */
  .window::after {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(20, 10, 0, .75) 0%, rgba(20, 10, 0, 0) 30%, rgba(20, 10, 0, 0) 70%, rgba(20, 10, 0, .75) 100%),
      linear-gradient(180deg, transparent 8%, rgba(255, 255, 255, .55) 9%, rgba(255, 255, 255, 0) 16%);
    pointer-events: none;
  }
  .machine.is-win .window { box-shadow: inset 0 0 0 2px #1a1208, inset 0 0 30px rgba(255, 200, 40, .9); }

  .strip {
    position: absolute;
    left: 0; right: 0; top: 0;
    will-change: transform;
    transition: filter .35s ease-out;
  }
  .strip.is-blurred { filter: blur(2.2px); }

  .item {
    height: var(--item-h);
    display: grid;
    place-items: center;
    border-bottom: 1px dashed rgba(90, 60, 20, .25);
    font-family: "Russo One", sans-serif;
    font-size: clamp(22px, 7.4vw, 27px);
    text-transform: uppercase;
    white-space: nowrap;
  }
  /* «ОТПУСТИЛО» — как красная семёрка: красная заливка, жёлтый контур, тёмная тень */
  .item--yes span {
    color: var(--red);
    text-shadow:
      2px 0 var(--outline), -2px 0 var(--outline), 0 2px var(--outline), 0 -2px var(--outline),
      1.5px 1.5px var(--outline), -1.5px -1.5px var(--outline), 1.5px -1.5px var(--outline), -1.5px 1.5px var(--outline),
      0 4px 0 var(--red-deep), 0 7px 10px rgba(0, 0, 0, .35);
  }
  /* «НЕ ОТПУСТИЛО» — как плашка BAR: белые буквы на чёрной ленте */
  .item--no span {
    position: relative;
    padding: 6px 12px 5px;
    font-size: .82em;
    color: #fff;
    background: #111;
    border-radius: 4px;
    letter-spacing: .03em;
    box-shadow: 0 0 0 2px #fff, 0 0 0 4px #111, 0 6px 10px rgba(0, 0, 0, .35);
  }

  /* указатели линии выигрыша */
  .payline {
    position: absolute;
    top: 50%;
    width: 0; height: 0;
    border: 9px solid transparent;
    transform: translateY(-50%);
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .6));
    z-index: 2;
  }
  .payline--l { left: -2px; border-left: 12px solid var(--red); }
  .payline--r { right: -2px; border-right: 12px solid var(--red); }

  /* ───────── ручка ───────── */
  .lever {
    --L: 108px;
    position: absolute;
    left: calc(100% + 10px);  /* внешняя граница корпуса */
    top: 50%;
    width: 46px;
    height: 0;
    z-index: 3;
  }
  .lever-mount {
    position: absolute;
    left: -2px; top: -40px;
    width: 20px; height: 80px;
    border-radius: 0 12px 12px 0;
    background: var(--gold-grad);
    box-shadow: inset -2px 0 4px rgba(0, 0, 0, .35), 3px 4px 8px rgba(0, 0, 0, .5);
  }
  .lever-rod {
    position: absolute;
    left: 20px; bottom: 0;
    width: 8px;
    height: var(--L);
    border-radius: 4px;
    background: var(--gold-grad-h);
    transform-origin: 50% 100%;
    transform: scaleY(var(--cos, 1));
    box-shadow: 2px 0 4px rgba(0, 0, 0, .4);
  }
  .lever-hub {
    position: absolute;
    left: 8px; top: -16px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff4bd 0%, #e2b04a 40%, #6d440c 100%);
    box-shadow: 0 3px 6px rgba(0, 0, 0, .6);
  }
  .lever-ball {
    position: absolute;
    left: 24px; top: 0;
    width: 44px; height: 44px;
    margin: 0; padding: 0; border: 0;
    border-radius: 50%;
    cursor: grab;
    touch-action: none;
    background: radial-gradient(circle at 34% 28%, #fff 0%, #ff8a80 10%, #e3141b 38%, #8e0006 78%, #4a0003 100%);
    box-shadow: 0 6px 12px rgba(0, 0, 0, .55), inset -3px -4px 8px rgba(0, 0, 0, .35);
    transform: translate(-50%, -50%) translateY(var(--by, -108px)) scale(var(--bs, 1));
  }
  .lever-ball:active { cursor: grabbing; }
  .lever-ball:focus-visible { outline: 3px solid var(--win); outline-offset: 3px; }
  /* подсказка «дёрни меня» в простое */
  .lever.is-hint .lever-ball::after {
    content: "";
    position: absolute; inset: -6px;
    border-radius: 50%;
    border: 2px solid rgba(255, 210, 90, .8);
    animation: ping 1.8s ease-out infinite;
  }
  @keyframes ping {
    0%   { transform: scale(.85); opacity: .9; }
    80%, 100% { transform: scale(1.5); opacity: 0; }
  }

  /* ───────── табличка статуса ───────── */
  .plate {
    margin-top: 14px;
    padding: 3px;
    border-radius: 12px;
    background: var(--gold-grad);
  }
  .plate-inner {
    min-height: 52px;
    display: grid;
    place-items: center;
    padding: 12px;
    border-radius: 9px;
    background: #0b0b0d;
    box-shadow: inset 0 0 12px rgba(0, 0, 0, .9);
    font-weight: 800;
    font-size: 17px;
    text-align: center;
    color: #ffe3a8;
  }
  .machine.is-win .plate-inner { color: var(--win); text-shadow: 0 0 10px rgba(255, 210, 60, .6); }
  .machine.is-lose .plate-inner { color: #ff8a8a; }

  /* ───────── монеты ───────── */
  .fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 5; }
  .coin {
    position: absolute;
    left: var(--x); top: var(--y);
    width: 26px; height: 26px;
    margin: -13px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6c8 0%, #ffd24a 40%, #c98a10 80%);
    box-shadow: inset 0 0 0 3px rgba(150, 90, 0, .55), 0 3px 6px rgba(0, 0, 0, .5);
    animation: coin 1.4s cubic-bezier(.2, .6, .4, 1) forwards;
    animation-delay: var(--d);
    opacity: 0;
  }
  @keyframes coin {
    0%   { opacity: 1; transform: translate(0, 0) rotateY(0) scale(.6); }
    35%  { opacity: 1; transform: translate(calc(var(--dx) * .55), var(--dy)) rotateY(360deg) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), 420px) rotateY(900deg) scale(1); }
  }

  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-6px); }
    40%, 60% { transform: translateX(6px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bulbs i, .lever.is-hint .lever-ball::after { animation: none !important; }
    .strip.is-blurred { filter: none; }
    .machine.is-lose { animation: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="machine" id="machine">
      <div class="body">
        <header class="marquee">
          <div class="marquee-panel">
            <div class="bulbs" id="bulbs" aria-hidden="true"></div>
            <h1 class="title">
              <span class="title-kicker">Статус</span>
              <span class="title-main">AppStore</span>
            </h1>
          </div>
        </header>

        <section class="cabinet">
          <div class="bezel">
            <span class="payline payline--l" aria-hidden="true"></span>
            <span class="payline payline--r" aria-hidden="true"></span>
            <div class="window">
              <div class="strip" id="strip" aria-hidden="true"></div>
            </div>
          </div>

          <div class="lever is-hint" id="lever">
            <div class="lever-mount"></div>
            <div class="lever-rod"></div>
            <div class="lever-hub"></div>
            <button class="lever-ball" id="leverBall" type="button" aria-label="Дёрнуть ручку"></button>
          </div>
        </section>

        <div class="plate">
          <div class="plate-inner" id="status" role="status" aria-live="polite">Дёрни за ручку</div>
        </div>
      </div>
    </div>
    <div class="fx" id="fx" aria-hidden="true"></div>
  </main>

<script>
(() => {
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();
  tg?.disableVerticalSwipes?.();       // иначе рывок ручки вниз сворачивает Mini App
  tg?.setHeaderColor?.('#1a0710');
  tg?.setBackgroundColor?.('#070204');
  const haptic = tg?.HapticFeedback;

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);
  const machine = $('machine'), strip = $('strip'), lever = $('lever'), ball = $('leverBall');
  const statusEl = $('status'), bulbsEl = $('bulbs'), fx = $('fx');

  const TEXT = { yes: 'Отпустило', no: 'Не отпустило' };
  const MESSAGES = { yes: 'Грузим прилы!', no: 'Всем прилам РЕДЖЕКТ' };

  /* ── лента барабана: чётные — «отпустило», нечётные — «не отпустило» ── */
  const ITEMS = 64;
  for (let i = 0; i < ITEMS; i++) {
    const kind = i % 2 === 0 ? 'yes' : 'no';
    const el = document.createElement('div');
    el.className = `item item--${kind}`;
    el.innerHTML = `<span>${TEXT[kind]}</span>`;
    strip.appendChild(el);
  }
  const cssPx = (name) => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));
  const itemH = cssPx('--item-h'), reelH = cssPx('--reel-h');
  const yFor = (index) => -index * itemH + (reelH - itemH) / 2;
  let current = 3;
  strip.style.transform = `translateY(${yFor(current)}px)`;

  /* ── лампочки по периметру табло ── */
  function layoutBulbs() {
    bulbsEl.innerHTML = '';
    const w = bulbsEl.clientWidth, h = bulbsEl.clientHeight, step = 19;
    const pts = [];
    const edge = (x1, y1, x2, y2) => {
      const n = Math.max(1, Math.round(Math.hypot(x2 - x1, y2 - y1) / step));
      for (let i = 0; i < n; i++) pts.push([x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n]);
    };
    edge(0, 0, w, 0); edge(w, 0, w, h); edge(w, h, 0, h); edge(0, h, 0, 0);
    pts.forEach(([x, y], i) => {
      const b = document.createElement('i');
      b.style.left = `${x}px`; b.style.top = `${y}px`;
      b.style.setProperty('--i', i % 3);
      bulbsEl.appendChild(b);
    });
  }
  document.fonts.ready.then(layoutBulbs);
  addEventListener('resize', layoutBulbs);

  /* ── геометрия ручки: p ∈ [0..1] → угол 0..160° (ручка «падает» к зрителю) ── */
  const L = 108;
  let leverP = 0;
  function setLever(p) {
    leverP = p;
    const a = p * (160 * Math.PI / 180);
    lever.style.setProperty('--cos', Math.cos(a).toFixed(4));
    lever.style.setProperty('--by', `${(-L * Math.cos(a)).toFixed(2)}px`);
    lever.style.setProperty('--bs', (1 + 0.28 * Math.sin(a)).toFixed(4));
  }
  setLever(0);

  function tween(from, to, ms, ease, onUpdate) {
    return new Promise((resolve) => {
      const t0 = performance.now();
      const frame = (now) => {
        const t = Math.min(1, (now - t0) / ms);
        onUpdate(from + (to - from) * ease(t));
        t < 1 ? requestAnimationFrame(frame) : resolve();
      };
      requestAnimationFrame(frame);
    });
  }
  const easeIn = (t) => t * t * t;
  const easeOutBack = (t) => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * (t - 1) ** 3 + c1 * (t - 1) ** 2; };
  const springBack = () => tween(leverP, 0, 650, easeOutBack, setLever);

  /* ── вращение ── */
  let busy = false;
  const setState = (s) => {
    machine.classList.remove('is-spinning', 'is-win', 'is-lose');
    if (s) machine.classList.add(`is-${s}`);
  };

  async function spin() {
    if (busy) return;
    busy = true;
    lever.classList.remove('is-hint');
    setState('spinning');
    statusEl.textContent = 'Проверяем статус…';
    haptic?.impactOccurred('heavy');

    const isYes = Math.random() < 0.5;
    const rounds = 18 + Math.floor(Math.random() * 6);
    let target = current + rounds * 2;
    if ((target % 2 === 0) !== isYes) target += 1;

    const duration = reduceMotion ? 900 : 2600 + Math.random() * 500;
    if (!reduceMotion) strip.classList.add('is-blurred');
    setTimeout(() => strip.classList.remove('is-blurred'), duration * 0.62);

    // тиканье вибрацией при прохождении каждой ячейки
    let lastIdx = current, lastTick = 0, ticking = true;
    const tick = (now) => {
      if (!ticking) return;
      const y = new DOMMatrix(getComputedStyle(strip).transform).m42;
      const idx = Math.round(((reelH - itemH) / 2 - y) / itemH);
      if (idx !== lastIdx && now - lastTick > 45) { haptic?.selectionChanged(); lastTick = now; }
      lastIdx = idx;
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);

    const anim = strip.animate(
      [{ transform: `translateY(${yFor(current)}px)` }, { transform: `translateY(${yFor(target) - 14}px)` }],
      { duration, easing: 'cubic-bezier(.12,.62,.16,1)', fill: 'forwards' }
    );
    await anim.finished;
    const settle = strip.animate(
      [{ transform: `translateY(${yFor(target) - 14}px)` }, { transform: `translateY(${yFor(target)}px)` }],
      { duration: 380, easing: 'cubic-bezier(.34,1.8,.5,1)', fill: 'forwards' }
    );
    await settle.finished;
    ticking = false;

    // лента повторяется через 2 ячейки — незаметно возвращаемся к началу
    current = 2 + (target % 2);
    strip.style.transform = `translateY(${yFor(current)}px)`;
    anim.cancel(); settle.cancel();

    setState(isYes ? 'win' : 'lose');
    statusEl.textContent = MESSAGES[isYes ? 'yes' : 'no'];
    haptic?.notificationOccurred(isYes ? 'success' : 'error');
    if (isYes && !reduceMotion) burstCoins();

    busy = false;
    setTimeout(() => { if (!busy) lever.classList.add('is-hint'); }, 2500);
  }

  function burstCoins() {
    const s = fx.getBoundingClientRect(), w = document.querySelector('.window').getBoundingClientRect();
    const cx = w.left - s.left + w.width / 2, cy = w.top - s.top + w.height / 2;
    for (let i = 0; i < 22; i++) {
      const c = document.createElement('span');
      c.className = 'coin';
      c.style.setProperty('--x', `${cx}px`);
      c.style.setProperty('--y', `${cy}px`);
      c.style.setProperty('--dx', `${(Math.random() - 0.5) * 360}px`);
      c.style.setProperty('--dy', `${-120 - Math.random() * 180}px`);
      c.style.setProperty('--d', `${Math.random() * 180}ms`);
      fx.appendChild(c);
      setTimeout(() => c.remove(), 1800);
    }
  }

  /* ── управление ручкой: тянуть вниз или просто тапнуть ── */
  async function autoPull() {
    if (busy) return;
    await tween(leverP, 1, reduceMotion ? 120 : 260, easeIn, setLever);
    spin();
    springBack();
  }

  let drag = null;
  ball.addEventListener('pointerdown', (e) => {
    if (busy) return;
    drag = { y0: e.clientY, moved: 0, fired: false };
    ball.setPointerCapture(e.pointerId);
  });
  ball.addEventListener('pointermove', (e) => {
    if (!drag || drag.fired) return;
    const dy = e.clientY - drag.y0;
    drag.moved = Math.max(drag.moved, Math.abs(dy));
    setLever(Math.min(1, Math.max(0, dy / 190)));
    if (leverP >= 0.92) {
      drag.fired = true;
      setLever(1);
      spin();
      springBack();
    }
  });
  const endDrag = () => {
    if (!drag) return;
    const { moved, fired } = drag;
    drag = null;
    if (fired) return;
    if (moved < 6) autoPull();
    else springBack();
  };
  ball.addEventListener('pointerup', endDrag);
  ball.addEventListener('pointercancel', endDrag);
  ball.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); autoPull(); }
  });
})();
</script>
